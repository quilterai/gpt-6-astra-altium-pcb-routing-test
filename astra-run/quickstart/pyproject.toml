[project]
name = "astra-router-altium"
version = "0.1.0"
description = "Local media tools for the Altium workstation"
requires-python = "==3.13.*"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.2.1",
    "numpy>=2.2.0",
    "windows-capture==2.0.1; sys_platform == 'win32'",
]

[tool.uv]
package = false

# Keep the media tools independent of any parent Python workspace.
[tool.uv.workspace]
members = []
